name: Fabriquer l'APK Android

on:
  push:
    branches: [main]
    paths: ['project.tar.xz', 'patch/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le code est présent
        run: test -f project.tar.xz || (echo "Déposez d'abord project.tar.xz dans le dépôt" && exit 1)

      - name: Déballer le code de l'appli
        run: tar -xJf project.tar.xz

      - name: Appliquer les mises à jour
        run: if [ -d patch ]; then cp -r patch/. .; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les images (icône, logo)
        run: |
          pip install pillow --break-system-packages || pip install pillow
          mkdir -p assets
          python3 tools/make_assets.py

      - name: Installer les modules
        run: npm ci || npm install

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          echo '-keep class * extends androidx.room.RoomDatabase { *; }' >> app/proguard-rules.pro
          echo '-keep class androidx.work.** { *; }' >> app/proguard-rules.pro
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ChauffeurTourVIP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChauffeurTourVIP-apk
          path: ChauffeurTourVIP.apk
          retention-days: 30

  test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChauffeurTourVIP-apk

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ouvrir l'appli sur un émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r ChauffeurTourVIP.apk
            adb logcat -c
            adb shell monkey -p fr.chauffeurtourvip.app -c android.intent.category.LAUNCHER 1
            sleep 40
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > screen.png
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo "CRASH"; grep -A 30 "FATAL EXCEPTION" logcat.txt | head -60; exit 1; else echo "APPLI OUVERTE SANS CRASH"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-test
          path: |
            logcat.txt
            screen.png
